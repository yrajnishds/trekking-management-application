<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>
        {{ page|title }} | Trek Management System
    </title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="d-flex flex-column bg-light min-vh-100">
    <!-- ================= Header ================= -->
    <header class="shadow-sm bg-primary">
        <nav class="navbar navbar-dark">
            <div class="container-lg">
                <span class="navbar-brand fw-bold fs-3">
                    <i class="me-2 bi bi-tree-fill"></i>
                    Trek Management System
                </span>
            </div>
        </nav>
    </header>
    <!-- ================= Main ================= -->
    <main class="container-lg flex-grow-1 py-5">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} fade show">
                        {{ message }}
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}
        {% endblock %}
    </main>
    <!-- ================= Footer ================= -->
    <footer class="mt-auto py-4 bg-dark text-light">
        <div class="container-lg">
            {% include "components/footer.html" %}
        </div>
    </footer>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
