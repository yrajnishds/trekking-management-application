{% import 'macros/forms.html' as fm %}

<div class="container my-4">
    <div class="card shadow border-0">
        <!-- ================= Header ================= -->
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="mb-0">
                        Book a Trek
                    </h3>
                    <small class="text-white-50">
                        Select a trekker, booking date, and an available trek.
                    </small>
                </div>
                <button type="button" class="btn btn-warning fw-bold" data-bs-toggle="collapse"
                    data-bs-target="#bookTrek" aria-expanded="false" aria-controls="bookTrek">
                    Book Trek
                </button>
            </div>
        </div>
        <!-- ================= Form ================= -->
        <div class="collapse" id="bookTrek">
            <form action="{{ url_for('trekker.trekker_booking_action') }}" method="POST">
                {{ form.hidden_tag() }}
                <div class="card-body">
                    <!-- ================= Booking Details ================= -->
                    <h4 class="pb-2 mb-4 border-bottom">
                        Booking Details
                    </h4>
                    <div class="row g-4">
                        <!-- Trekker -->
                        {{ fm.render_field(form.trekker_id) }}
                        <!-- Booking Date -->
                        {{ fm.render_field(form.date) }}
                    </div>
                    <!-- ================= Trek Selection ================= -->
                    <h4 class="mt-5 pb-2 mb-4 border-bottom">
                        Trek Selection
                    </h4>
                    <div class="row g-4">
                        {{ fm.render_field(form.trek_id, size='full') }}
                    </div>
                </div>
                <!-- ================= Footer ================= -->
                <div class="card-footer bg-light">
                    <div class="d-flex gap-3 justify-content-center">
                        <button type="submit" class="px-5 btn btn-success btn-lg fw-bold">
                            Book Trek
                        </button>
                        <button type="reset" class="px-5 btn btn-outline-secondary btn-lg fw-bold">
                            Reset
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
